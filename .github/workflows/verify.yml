name: Verify composition system

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify manifest and generated directory records
        run: python3 tools/workspace_layout.py check --catalog-only
      - name: Verify live coordination identity and visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/verify_repository_access.py --github
      - name: Verify preservation and naming rules
        run: python3 -m unittest discover -s tools/tests -v
      - name: Install Playwright Chromium for the silent-launch page proof
        run: |
          npm install --prefix "$RUNNER_TEMP/silent-pw" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/silent-pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify composition acceptance guards and silent browser launches
        env:
          NODE_PATH: ${{ runner.temp }}/silent-pw/node_modules
          SILENT_BROWSER_REQUIRE_PAGE: "1"
        run: node --test tools/tests/test_verify_tmb_composition.cjs tools/tests/test_silent_browser.cjs
